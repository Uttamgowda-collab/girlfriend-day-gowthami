<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Our Love Story</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at top, #160018 0%, #050005 55%, #000 100%);
    font-family: 'Poppins', sans-serif;
    color: #fff;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .scene {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    position: relative;
  }

  .card {
    width: min(92vw, 540px);
    padding: 26px 20px 28px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 190, 225, 0.16);
    backdrop-filter: blur(12px);
    box-shadow: 0 0 45px rgba(255, 77, 136, 0.12);
    position: relative;
    z-index: 3;
  }

  .headphone {
    font-size: 18px;
    letter-spacing: 0.5px;
    opacity: 0.92;
    margin-bottom: 16px;
    animation: pulse 2s infinite ease-in-out;
  }

  .flower-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 8px 0 14px;
    opacity: 0;
    animation: fadeUp 1.5s forwards;
    animation-delay: 1s;
  }

  .flower {
    font-size: 120px;
    line-height: 1;
    animation: floatFlower 4s ease-in-out infinite;
    filter: drop-shadow(0 0 12px rgba(255, 120, 180, 0.3));
  }

  .title {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(34px, 6vw, 56px);
    color: #fff;
    text-shadow: 0 0 10px rgba(255, 77, 136, 0.75),
                 0 0 20px rgba(255, 215, 0, 0.30);
    margin-top: 8px;
    opacity: 0;
    animation: fadeUp 1.5s forwards;
    animation-delay: 2.2s;
  }

  .name {
    font-size: clamp(22px, 4.2vw, 30px);
    color: #ffb6d5;
    margin-top: 8px;
    opacity: 0;
    animation: fadeUp 1.5s forwards;
    animation-delay: 2.9s;
    letter-spacing: 0.5px;
  }

  .btn-wrap {
    margin-top: 18px;
    opacity: 0;
    animation: fadeUp 1.3s forwards;
    animation-delay: 3.8s;
  }

  button {
    appearance: none;
    border: none;
    outline: none;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, #ff4d88, #ff7aa5);
    box-shadow: 0 0 22px rgba(255, 77, 136, 0.45);
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  button:hover, button:active {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(255, 77, 136, 0.75);
  }

  .sub {
    margin-top: 14px;
    font-size: 13px;
    opacity: 0.75;
    line-height: 1.5;
  }

  .sparkle {
    position: absolute;
    top: -20px;
    font-size: 16px;
    opacity: 0;
    animation: sparkleFall linear infinite;
    pointer-events: none;
    z-index: 1;
  }

  .fade-out {
    animation: fadeOut 0.8s forwards !important;
  }

  .next-scene {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: radial-gradient(circle at top, rgba(255, 77, 136, 0.08), rgba(0,0,0,0.88));
    z-index: 10;
    opacity: 0;
  }

  .next-scene.show {
    display: flex;
    animation: fadeIn 0.8s forwards;
  }

  .next-title {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(34px, 6vw, 58px);
    color: #fff;
    text-shadow: 0 0 14px rgba(255, 255, 255, 0.35),
                 0 0 28px rgba(255, 105, 180, 0.45);
    margin-bottom: 10px;
  }

  .next-text {
    font-size: 16px;
    opacity: 0.92;
    max-width: 82%;
    line-height: 1.7;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes fadeOut {
    to { opacity: 0; transform: scale(0.98); }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.03); opacity: 1; }
  }

  @keyframes floatFlower {
    0%, 100% { transform: translateY(0px) rotate(-1deg); }
    50% { transform: translateY(-8px) rotate(1deg); }
  }

  @keyframes sparkleFall {
    from {
      transform: translateY(-20px) translateX(0);
      opacity: 0;
    }
    10% { opacity: 1; }
    100% {
      transform: translateY(110vh) translateX(22px);
      opacity: 0;
    }
  }

  @media (max-width: 480px) {
    .card {
      padding: 22px 16px 24px;
      border-radius: 22px;
    }
    button {
      width: 100%;
    }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="card" id="card">
    <div class="headphone">🎧 Put on your headphones...</div>

    <div class="flower-wrap">
      <div class="flower">🌷</div>
    </div>

    <div class="title">For My Beautiful Girlfriend</div>
    <div class="name">Gowthami ❤️</div>

    <div class="btn-wrap">
      <button onclick="openLove()">🌷 Open My Love</button>
    </div>

    <div class="sub">
      A little beginning for something very special.
    </div>
  </div>

  <div class="next-scene" id="nextScene">
    <div class="next-title">Scene 2 is next 💌</div>
    <div class="next-text">
      Your love letter scene will open here next.<br>
      Music starts now, and the story continues.
    </div>
  </div>
</div>

<audio id="music" loop>
  <source src="untilifoundyou.mp3" type="audio/mpeg">
</audio>

<script>
  const sparkleChars = ["✨", "🌟", "💖"];

  for (let i = 0; i < 30; i++) {
    const s = document.createElement("div");
    s.className = "sparkle";
    s.textContent = sparkleChars[Math.floor(Math.random() * sparkleChars.length)];
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (5 + Math.random() * 5) + "s";
    s.style.animationDelay = Math.random() * 4 + "s";
    s.style.fontSize = (14 + Math.random() * 14) + "px";
    document.body.appendChild(s);
  }

  function openLove() {
    const card = document.getElementById("card");
    const nextScene = document.getElementById("nextScene");
    const music = document.getElementById("music");

    music.play().catch(() => {});

    card.classList.add("fade-out");

    setTimeout(() => {
      card.style.display = "none";
      nextScene.classList.add("show");
    }, 800);
  }
</script>

</body>
  </html>
